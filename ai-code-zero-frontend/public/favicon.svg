<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 外层光晕效果 -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1890ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#722ed1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#13c2c2;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1890ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1890ff;stop-opacity:0" />
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景光晕 -->
  <circle cx="32" cy="32" r="30" fill="url(#glow)"/>
  
  <!-- 主背景圆形 -->
  <circle cx="32" cy="32" r="28" fill="url(#gradient)" stroke="#ffffff" stroke-width="1" filter="url(#shadow)"/>
  
  <!-- AI芯片风格装饰 -->
  <g transform="translate(32,32)">
    <!-- 外圈电路 -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.4"/>
    
    <!-- 电路节点 -->
    <circle cx="20" cy="0" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="-20" cy="0" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="0" cy="20" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="0" cy="-20" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="14" cy="14" r="1" fill="#ffffff" opacity="0.6"/>
    <circle cx="-14" cy="14" r="1" fill="#ffffff" opacity="0.6"/>
    <circle cx="14" cy="-14" r="1" fill="#ffffff" opacity="0.6"/>
    <circle cx="-14" cy="-14" r="1" fill="#ffffff" opacity="0.6"/>
    
    <!-- 中心AI核心 -->
    <polygon points="-8,-8 8,-8 8,8 -8,8" fill="#ffffff" stroke="#722ed1" stroke-width="1" rx="2"/>
    <circle cx="0" cy="0" r="4" fill="#722ed1" opacity="0.8"/>
    
    <!-- 数据流动线条 -->
    <line x1="-12" y1="-12" x2="-6" y2="-6" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
    <line x1="12" y1="-12" x2="6" y2="-6" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
    <line x1="-12" y1="12" x2="-6" y2="6" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
    <line x1="12" y1="12" x2="6" y2="6" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
    
    <!-- 科技感装饰点 -->
    <circle cx="0" cy="-25" r="0.8" fill="#13c2c2" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="25" cy="0" r="0.8" fill="#13c2c2" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="25" r="0.8" fill="#13c2c2" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-25" cy="0" r="0.8" fill="#13c2c2" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 顶部装饰光环 -->
  <ellipse cx="32" cy="12" rx="8" ry="2" fill="#ffffff" opacity="0.6"/>
  
  <!-- 底部品牌标识 -->
  <text x="32" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ffffff" opacity="0.8" font-weight="bold">AI</text>
</svg>