spring:
  application:
    name: yu-ai-code-zero-backend
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_code_zero
    username: root
    password: 123456
  # redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600 # 缓存的过期时间
      database: 0 # 不同的业务可以用不同的库，进行隔离缓存
  profiles:
    active: local
server:
  port: 8123
  servlet:
    context-path: /api
    # session 30 天过期
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.ynwe.aicodezero.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
